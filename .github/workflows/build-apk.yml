name: Build GhostKernel Signed Release

on:
  workflow_dispatch:

concurrency:
  group: ghostkernel-signed-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Gradle Memory
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          kotlin.incremental=true
          EOF

      - name: Verify Keystore
        run: |
          echo "--- Keystore file ---"
          ls -lh ${{ github.workspace }}/app/korndog-release.keystore
          file ${{ github.workspace }}/app/korndog-release.keystore

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build GithubRelease APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/app/korndog-release.keystore
          SIGNING_STORE_PASSWORD: "KornDog2024!"
          SIGNING_KEY_ALIAS: "korndog"
          SIGNING_KEY_PASSWORD: "KornDog2024!"
          KORNOS_SYNC_URL: ${{ secrets.KORNOS_SYNC_URL }}
          KORNOS_SYNC_KEY: ${{ secrets.KORNOS_SYNC_KEY }}
        run: |
          ./gradlew assembleGithubRelease \
            --build-cache \
            --parallel \
            --stacktrace

      - name: Find APK
        run: |
          find app/build/outputs -type f -name "*.apk" -exec ls -lh {} \;

      - name: Copy Signed APK
        run: |
          mkdir -p release-apks
          SIGNED_APK=$(find app/build/outputs -type f -name "*github*release*.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$SIGNED_APK" ]; then
            SIGNED_APK=$(find app/build/outputs -type f -name "*release*.apk" ! -name "*unsigned*" | head -1)
          fi
          if [ -z "$SIGNED_APK" ]; then
            echo "No signed APK found"
            exit 1
          fi
          cp "$SIGNED_APK" release-apks/GhostKernel-2.0.apk
          MAPPING_FILE=$(find app/build/outputs/mapping -type f -name "mapping.txt" | head -1)
          if [ -n "$MAPPING_FILE" ]; then
            cp "$MAPPING_FILE" "release-apks/mapping-b${{ github.run_number }}.txt"
            echo "Mapping file copied for deobfuscation"
          else
            echo "No mapping.txt found - minification may be disabled"
          fi
          ls -lh release-apks/

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-apks/*.apk
            release-apks/*.txt
          tag_name: ghostkernel-2.0-official
          name: "⬡ GhostKernel 2.0 — Official Release"
          body: |
            # GhostKernel 2.0 — Official Release

            GhostKernel is now the official KornDog music app.

            **GhostKernel 2.0**
            - YouTube Music streaming
            - Background and screen-off playback
            - Lock-screen and Bluetooth media controls
            - Persistent queue and auto-continuation
            - Songs, albums, artists, search and lyrics
            - Ghost Brain music discovery
            - My Music DNA
            - Android Auto
            - Offline local music playback
            - NouTube-powered song downloads
            - NouTube-powered full album downloads
            - Downloaded music saved to Music/NouTube
            - Album downloads skip tracks already saved
            - Automatic yt-dlp maintenance
            - Share Debug Log support
            - In-app updater support
            - Signed with the permanent KornDog Records release key

            **Release**
            - GhostKernel 2.0
            - KornDog Records
            - Official production build

            Knowledge Never Dies.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
