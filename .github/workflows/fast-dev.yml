name: GhostKernel 2.0 Fast Dev APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ghostkernel2-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build GhostKernel GitHub debug APK
        run: ./gradlew :app:assembleGithubDebug --build-cache --parallel

      - name: Find and name APK
        run: |
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | grep -i github | grep -i debug | head -1)

          if [ -z "$APK" ]; then
            echo "GitHub debug APK not found"
            find app/build/outputs -type f -name "*.apk" -print
            exit 1
          fi

          OUTPUT="GhostKernel-2.0-dev-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$OUTPUT"
          echo "OUTPUT_APK=$OUTPUT" >> "$GITHUB_ENV"

          echo "Built:"
          ls -lh "$OUTPUT"

      - name: Upload GhostKernel 2.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostKernel-2.0-dev-${{ github.run_number }}
          path: ${{ env.OUTPUT_APK }}
          if-no-files-found: error
